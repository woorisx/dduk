name: Deploy kmh to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-kmh
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dduk-backend:${{ github.ref_name }}
  AI_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/dduk-ai-server:${{ github.ref_name }}
  RPA_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/dduk-rpa-server:${{ github.ref_name }}

jobs:
  build-and-push:
    name: Build and push deploy images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/dduk-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push ai-server image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-server
          file: ./ai-server/Dockerfile
          push: true
          tags: |
            ${{ env.AI_SERVER_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/dduk-ai-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=ai-server
          cache-to: type=gha,mode=max,scope=ai-server

      - name: Build and push rpa image
        uses: docker/build-push-action@v6
        with:
          context: ./rpa
          file: ./rpa/Dockerfile
          push: true
          tags: |
            ${{ env.RPA_SERVER_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/dduk-rpa-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=rpa
          cache-to: type=gha,mode=max,scope=rpa

  deploy:
    name: Pull deploy images on EC2
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "EC2_HOST secret is missing"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER secret is missing"; exit 1; }
          test -n "$EC2_DEPLOY_PATH" || { echo "EC2_DEPLOY_PATH secret is missing"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_KEY secret is missing"; exit 1; }
          test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME secret is missing"; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo "GHCR_READ_TOKEN secret is missing"; exit 1; }
          if [ -z "${EC2_PORT:-}" ]; then
            echo "EC2_PORT is empty. The workflow will use port 22."
          fi

      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          CLEAN_HOST=$(echo "$EC2_HOST" | tr -d '\r' | xargs)
          CLEAN_PORT=$(echo "${EC2_PORT:-22}" | tr -d '\r' | xargs)
          [ -n "$CLEAN_PORT" ] || CLEAN_PORT=22
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/dduk-erp-key.pem
          chmod 600 ~/.ssh/dduk-erp-key.pem
          ssh-keyscan -p "$CLEAN_PORT" -H "$CLEAN_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy pull-only stack on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          AI_SERVER_IMAGE: ${{ env.AI_SERVER_IMAGE }}
          RPA_SERVER_IMAGE: ${{ env.RPA_SERVER_IMAGE }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DB_URL: ${{ secrets.DB_URL || vars.DB_URL || secrets.DATABASE_URL || vars.DATABASE_URL || secrets.SPRING_DATASOURCE_URL || vars.SPRING_DATASOURCE_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME || secrets.DB_USER || vars.DB_USER || secrets.DATABASE_USERNAME || vars.DATABASE_USERNAME || secrets.SPRING_DATASOURCE_USERNAME || vars.SPRING_DATASOURCE_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD || secrets.DATABASE_PASSWORD || vars.DATABASE_PASSWORD || secrets.SPRING_DATASOURCE_PASSWORD || vars.SPRING_DATASOURCE_PASSWORD }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH || vars.FRONTEND_PATH }}
          APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.APP_CORS_ALLOWED_ORIGIN_PATTERNS || vars.APP_CORS_ALLOWED_ORIGIN_PATTERNS }}
          JPA_DDL_AUTO: ${{ secrets.JPA_DDL_AUTO || vars.JPA_DDL_AUTO }}
          JPA_SHOW_SQL: ${{ secrets.JPA_SHOW_SQL || vars.JPA_SHOW_SQL }}
          JPA_FORMAT_SQL: ${{ secrets.JPA_FORMAT_SQL || vars.JPA_FORMAT_SQL }}
          SQL_INIT_MODE: ${{ secrets.SQL_INIT_MODE || vars.SQL_INIT_MODE }}
          SQL_INIT_CONTINUE_ON_ERROR: ${{ secrets.SQL_INIT_CONTINUE_ON_ERROR || vars.SQL_INIT_CONTINUE_ON_ERROR }}
          ACCOUNTING_SEED: ${{ secrets.ACCOUNTING_SEED || vars.ACCOUNTING_SEED }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET || secrets.JWT_SECRET_KEY || vars.JWT_SECRET_KEY }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION || vars.JWT_EXPIRATION }}
          RPA_CALLBACK_TOKEN: ${{ secrets.RPA_CALLBACK_TOKEN || vars.RPA_CALLBACK_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || vars.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
          PORT: ${{ secrets.PORT || vars.PORT }}
          AI_SERVER_PORT: ${{ secrets.AI_SERVER_PORT || vars.AI_SERVER_PORT }}
          RPA_SERVER_PORT: ${{ secrets.RPA_SERVER_PORT || vars.RPA_SERVER_PORT }}
        run: |
          set -euo pipefail
          CLEAN_HOST=$(echo "$EC2_HOST" | tr -d '\r' | xargs)
          CLEAN_USER=$(echo "$EC2_USER" | tr -d '\r' | xargs)
          CLEAN_PORT=$(echo "${EC2_PORT:-22}" | tr -d '\r' | xargs)
          [ -n "$CLEAN_PORT" ] || CLEAN_PORT=22
          CLEAN_DEPLOY_PATH=$(echo "$EC2_DEPLOY_PATH" | tr -d '\r' | xargs)
          CLEAN_GHCR_USERNAME=$(echo "$GHCR_USERNAME" | tr -d '\r' | xargs)
          CLEAN_DEPLOY_BRANCH=$(echo "$DEPLOY_BRANCH" | tr -d '\r' | xargs)

          ssh -o IdentitiesOnly=yes -i ~/.ssh/dduk-erp-key.pem -p "$CLEAN_PORT" "$CLEAN_USER@$CLEAN_HOST" \
            "export EC2_DEPLOY_PATH='$CLEAN_DEPLOY_PATH' DEPLOY_BRANCH='$CLEAN_DEPLOY_BRANCH'; bash -s" <<'EOF_SYNC'
            set -euo pipefail

            if [ -d "$EC2_DEPLOY_PATH/.git" ]; then
              cd "$EC2_DEPLOY_PATH"
              git fetch origin
            else
              mkdir -p "$(dirname "$EC2_DEPLOY_PATH")"
              rm -rf "$EC2_DEPLOY_PATH"
              git clone https://github.com/woorisx/dduk.git "$EC2_DEPLOY_PATH"
              cd "$EC2_DEPLOY_PATH"
              git fetch origin
            fi

            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd -e .env.aws -e .env.production
            echo "EC2 source synced to origin/$DEPLOY_BRANCH at $(git rev-parse --short HEAD)"
          EOF_SYNC

          required_env() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "$name is missing. Add it to GitHub Actions secrets or variables." >&2
              exit 1
            fi
          }

          required_env DB_URL
          required_env DB_USERNAME
          required_env DB_PASSWORD
          required_env JWT_SECRET

          umask 077
          cat > .env.aws <<EOF_ENV
          DB_URL=${DB_URL}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          SPRING_DATASOURCE_URL=${DB_URL}
          SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
          SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
          FRONTEND_PATH=${FRONTEND_PATH:-classpath:/static/}
          APP_CORS_ALLOWED_ORIGIN_PATTERNS=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
          JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
          JPA_SHOW_SQL=${JPA_SHOW_SQL:-false}
          JPA_FORMAT_SQL=${JPA_FORMAT_SQL:-false}
          SQL_INIT_MODE=${SQL_INIT_MODE:-always}
          SQL_INIT_CONTINUE_ON_ERROR=${SQL_INIT_CONTINUE_ON_ERROR:-true}
          ACCOUNTING_SEED=${ACCOUNTING_SEED:-true}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
          RPA_CALLBACK_TOKEN=${RPA_CALLBACK_TOKEN}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
          PORT=${PORT:-8080}
          AI_SERVER_PORT=${AI_SERVER_PORT:-5000}
          RPA_SERVER_PORT=${RPA_SERVER_PORT:-5050}
          BACKEND_IMAGE=${BACKEND_IMAGE}
          AI_SERVER_IMAGE=${AI_SERVER_IMAGE}
          RPA_SERVER_IMAGE=${RPA_SERVER_IMAGE}
          EOF_ENV

          ssh -o IdentitiesOnly=yes -i ~/.ssh/dduk-erp-key.pem -p "$CLEAN_PORT" "$CLEAN_USER@$CLEAN_HOST" "mkdir -p '$CLEAN_DEPLOY_PATH'"
          scp -o IdentitiesOnly=yes -i ~/.ssh/dduk-erp-key.pem -P "$CLEAN_PORT" .env.aws "$CLEAN_USER@$CLEAN_HOST:$CLEAN_DEPLOY_PATH/.env.aws"
          
          ssh -o IdentitiesOnly=yes -i ~/.ssh/dduk-erp-key.pem -p "$CLEAN_PORT" "$CLEAN_USER@$CLEAN_HOST" \
            "export EC2_DEPLOY_PATH='$CLEAN_DEPLOY_PATH' DEPLOY_BRANCH='$CLEAN_DEPLOY_BRANCH' GHCR_USERNAME='$CLEAN_GHCR_USERNAME' GHCR_READ_TOKEN='$GHCR_READ_TOKEN' BACKEND_IMAGE='$BACKEND_IMAGE' AI_SERVER_IMAGE='$AI_SERVER_IMAGE' RPA_SERVER_IMAGE='$RPA_SERVER_IMAGE'; bash -s" <<'EOF'
            set -euo pipefail
            cd "$EC2_DEPLOY_PATH"

            install_docker() {
              if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
                return 0
              fi

              if ! command -v sudo >/dev/null 2>&1; then
                echo "sudo is required to install Docker on this EC2 instance." >&2
                return 1
              fi

              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings

              if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                sudo chmod a+r /etc/apt/keyrings/docker.gpg
              fi

              . /etc/os-release
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable --now docker
            }

            install_docker

            DOCKER_CMD=(docker)
            if ! docker info >/dev/null 2>&1; then
              DOCKER_CMD=(sudo docker)
              "${DOCKER_CMD[@]}" info >/dev/null
            fi

            docker_cmd() {
              "${DOCKER_CMD[@]}" "$@"
            }

            trap 'docker_cmd compose --env-file .env.aws -f docker-compose.deploy.yml logs --tail=100 backend ai-server rpa-server || true' ERR

            git fetch origin
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "$GHCR_READ_TOKEN" | docker_cmd login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker_cmd compose --env-file .env.aws -f docker-compose.deploy.yml config
            docker_cmd compose --env-file .env.aws -f docker-compose.deploy.yml pull
            docker_cmd compose --env-file .env.aws -f docker-compose.deploy.yml up -d --force-recreate
            docker_cmd compose --env-file .env.aws -f docker-compose.deploy.yml ps

            wait_for_http() {
              local url="$1"
              local label="$2"
              local attempt=1

              while [ "$attempt" -le 30 ]; do
                if command -v curl >/dev/null 2>&1; then
                  if curl -fsS "$url" >/dev/null; then
                    echo "$label is ready"
                    return 0
                  fi
                elif wget -qO- "$url" >/dev/null; then
                  echo "$label is ready"
                  return 0
                fi

                echo "Waiting for $label ($attempt/30): $url"
                sleep 5
                attempt=$((attempt + 1))
              done

              echo "$label did not become ready in time: $url" >&2
              return 1
            }

            wait_for_http http://localhost:8080/index.html backend
            wait_for_http http://localhost:5000/health ai-server
            wait_for_http http://localhost:5050/health rpa-server
          EOF

<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매/발주 대시보드 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        .metric-card{background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.02)}
        .metric-label{font-size:.8125rem;font-weight:600;color:#64748b}
        .metric-value{margin-top:.625rem;font-size:1.75rem;font-weight:700;color:#1e293b;line-height:1}
        .metric-sub{margin-top:.5rem;font-size:.8125rem;font-weight:500;color:#64748b}
        .panel{background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.02)}
        .status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:600;background:#f1f5f9;color:#334155;white-space:nowrap}
        .chart-bar{border-radius:.375rem .375rem 0 0;min-height:.25rem}
        .progress-gauge-row{display:grid;grid-template-columns:4.5rem minmax(0,1fr);align-items:center;gap:1rem;padding-bottom:1rem;border-bottom:1px solid #f1f5f9}
        .progress-gauge-row:last-child{padding-bottom:0;border-bottom:0}
        .progress-gauge{width:4.5rem;height:4.5rem;border-radius:999px;display:grid;place-items:center;background:conic-gradient(var(--gauge-color) var(--gauge-stop), #e5e7eb 0);position:relative;box-shadow:inset 0 0 0 1px rgba(15,23,42,.06)}
        .progress-gauge::after{content:"";position:absolute;inset:.55rem;border-radius:999px;background:#fff}
        .progress-gauge strong{position:relative;z-index:1;font-size:.9rem;font-weight:700;color:#0f172a}
        .progress-title{font-size:.95rem;font-weight:700;color:#1e293b}
        .progress-note{margin-top:.35rem;font-size:.78rem;font-weight:500;color:#64748b}
        .status-stack{display:flex;height:1.05rem;border-radius:999px;overflow:hidden;background:#e5e7eb;box-shadow:inset 0 0 0 1px rgba(15,23,42,.05)}
        .status-stack-segment{height:100%;min-width:.25rem}
        .status-legend{display:grid;gap:.75rem;margin-top:1rem}
        .status-legend-row{display:grid;grid-template-columns:1rem minmax(0,1fr) auto;align-items:center;gap:.65rem}
        .status-dot-chip{width:.75rem;height:.75rem;border-radius:999px;box-shadow:0 0 0 3px var(--status-bg)}
        .status-label-text{font-size:.86rem;font-weight:600;color:#1f2937}
        .status-count-text{font-size:.8rem;font-weight:600;color:#475569;white-space:nowrap}
        .status-mini-track{height:.35rem;border-radius:999px;background:#eef2f7;overflow:hidden;margin-top:.3rem}
        .status-mini-fill{height:100%;border-radius:999px}
        .rpa-shell{background:#fff;border:1px solid #e2e8f0}
        .rpa-chip{display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;padding:.3rem .7rem;font-size:.75rem;font-weight:600}
        .rpa-chip.ready{background:#dcfce7;color:#166534}
        .rpa-chip.waiting{background:#fef3c7;color:#92400e}
        .rpa-chip.missing{background:#fee2e2;color:#b91c1c}
        .rpa-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
        .rpa-stat{border-radius:.75rem;background:#f8fafc;border:1px solid #e2e8f0;padding:1rem}
        .rpa-stat-label{font-size:.75rem;font-weight:600;color:#475569}
        .rpa-stat-value{margin-top:.45rem;font-size:1.4rem;font-weight:700;color:#1e293b}
        .rpa-stat-note{margin-top:.3rem;font-size:.75rem;font-weight:500;color:#64748b}
        .rpa-table{width:100%;border-collapse:collapse}
        .rpa-table th,.rpa-table td{padding:.8rem .75rem;border-top:1px solid #e2e8f0;font-size:.84rem}
        .rpa-table th{font-size:.74rem;font-weight:600;color:#475569;background:#f8fafc;text-align:left}
        .rpa-empty{padding:1.2rem;border-radius:.75rem;background:#f8fafc;border:1px dashed #cbd5e1;color:#64748b;font-size:.85rem;font-weight:600}
        @media (max-width: 1024px){.rpa-stat-grid{grid-template-columns:1fr}}
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 flex justify-between items-center bg-white border-b sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
                    <i data-lucide="menu"></i>
                </button>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">구매/발주 대시보드</h1>
                    <p id="message" class="text-sm text-gray-500 mt-1">발주 현황, 단가 비교, 최근 주문 흐름을 한 번에 본다.</p>
                </div>
            </div>
            <div id="base-date" class="text-sm font-bold text-slate-500"></div>
        </header>

        <main class="content_area p-6 max-w-7xl mx-auto">
            <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4 mb-6">
                <article class="metric-card">
                    <div class="flex items-center justify-between">
                        <p class="metric-label">발주 건수</p>
                        <i data-lucide="clipboard-list" class="w-5 h-5 text-indigo-500"></i>
                    </div>
                    <p id="order-count" class="metric-value">-</p>
                    <p class="metric-sub">전체 발주 기준</p>
                </article>
                <article class="metric-card">
                    <div class="flex items-center justify-between">
                        <p class="metric-label">발주 완료</p>
                        <i data-lucide="send" class="w-5 h-5 text-emerald-500"></i>
                    </div>
                    <p id="completed-order-count" class="metric-value">-</p>
                    <p id="order-rate" class="metric-sub">-</p>
                </article>
                <article class="metric-card">
                    <div class="flex items-center justify-between">
                        <p class="metric-label">입고 중</p>
                        <i data-lucide="package-plus" class="w-5 h-5 text-sky-500"></i>
                    </div>
                    <p id="receiving-count" class="metric-value">-</p>
                    <p class="metric-sub">입고 진행 상태 기준</p>
                </article>
                <article class="metric-card">
                    <div class="flex items-center justify-between">
                        <p class="metric-label">입고 지연</p>
                        <i data-lucide="clock-alert" class="w-5 h-5 text-rose-500"></i>
                    </div>
                    <p id="delay-count" class="metric-value text-rose-600">-</p>
                    <p id="delay-rate" class="metric-sub">-</p>
                </article>
                <article class="metric-card">
                    <div class="flex items-center justify-between">
                        <p class="metric-label">입고 완료</p>
                        <i data-lucide="package-check" class="w-5 h-5 text-teal-500"></i>
                    </div>
                    <p id="received-count" class="metric-value">-</p>
                    <p id="received-rate" class="metric-sub">-</p>
                </article>
            </section>

            

            <section class="grid grid-cols-1 xl:grid-cols-[minmax(0,1.45fr)_minmax(340px,.55fr)] gap-6 mb-6">
                <article class="panel p-5">
                    <div class="flex items-center justify-between mb-5">
                        <div>
                            <h2 class="text-base font-bold text-slate-800">월별 발주 추이</h2>
                            <p class="text-sm text-gray-500 mt-1">최근 6개월 발주 건수와 금액 흐름이야.</p>
                        </div>
                        <i data-lucide="bar-chart-3" class="w-5 h-5 text-indigo-500"></i>
                    </div>
                    <div id="monthly-chart" class="h-72 flex items-end gap-4 border-b border-slate-200 px-2"></div>
                </article>

                <article class="panel p-5">
                    <div class="flex items-center justify-between mb-5">
                        <div>
                            <h2 class="text-base font-bold text-slate-800">진행률</h2>
                            <p class="text-sm text-gray-500 mt-1">완료와 지연 비율을 빠르게 본다.</p>
                        </div>
                        <i data-lucide="gauge" class="w-5 h-5 text-emerald-500"></i>
                    </div>
                    <div id="progress-list" class="space-y-5"></div>
                </article>
            </section>

            <section class="grid grid-cols-1 xl:grid-cols-[minmax(340px,.55fr)_minmax(0,1.45fr)] gap-6">
                <article class="panel p-5">
                    <h2 class="text-base font-bold text-slate-800 mb-4">상태별 발주</h2>
                    <div id="status-list" class="space-y-3"></div>
                </article>

                <article class="panel overflow-hidden">
                    <div class="p-5 border-b border-slate-100 flex items-start justify-between gap-3">
                        <div>
                            <h2 class="text-base font-bold text-slate-800">최근 발주</h2>
                            <p class="text-sm text-gray-500 mt-1">가장 최근에 등록된 발주 6건이야.</p>
                        </div>
                        <button type="button" onclick="location.href='purchase-orders.html'" class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 whitespace-nowrap">
                            <i data-lucide="list-plus" class="w-4 h-4"></i>
                            전체 보기
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-slate-50 text-xs font-semibold text-slate-500">
                                    <th class="text-left p-3">발주번호</th>
                                    <th class="text-left p-3">거래처</th>
                                    <th class="text-left p-3">상태</th>
                                    <th class="text-left p-3">예정일</th>
                                    <th class="text-right p-3">금액</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders"></tbody>
                        </table>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script src="../../services/common/session.js"></script>
    <script src="../../services/common/sidebar.js"></script>
    <script src="../../services/common/apiClient.js"></script>
    <script src="../../services/inventory/inventory-purchase-dashboard-page.js"></script>
    

</body>
</html>

<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDUK ERP - AI/RPA 작업 이력</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/common/dashboard.css">
  <link rel="stylesheet" href="../../styles/admin/admin-pages.css">
  <style>
    pre {
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.2) transparent;
    }

    pre::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    pre::-webkit-scrollbar-track {
      background: transparent;
    }

    pre::-webkit-scrollbar-thumb {
      background-color: rgba(99, 102, 241, 0.2);
      border-radius: 3px;
    }
  </style>
</head>

<body class="w-full">
  <aside data-dduk-sidebar></aside>

  <div class="main_wrap">
    <header class="topbar">
      <button class="sidebar_icon_btn dduk-inline-027" onclick="toggleSidebar()" id="mobile_menu_btn" aria-label="메뉴">
        <i class="dduk-inline-028" data-lucide="menu"></i>
      </button>
      <div class="flex-1 px-4">
        <h2 class="text-lg font-semibold text-gray-800">AI/RPA 작업 이력 관리</h2>
      </div>
    </header>

    <main class="content_area space-y-6 p-6">
      <div class="mb-4 flex flex-col justify-between gap-4 md:flex-row md:items-end">
        <div>
          <h2 class="text-2xl font-bold text-gray-900">작업 이력 조회</h2>
          <p class="mt-1 text-gray-500">AI 챗봇 테스트와 RPA 실행 과정에서 저장된 작업 상태와 송수신 payload를 확인합니다.</p>
        </div>
        <div>
          <button type="button" id="refreshTasksBtn" class="flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-600 shadow-sm transition-colors hover:bg-gray-50">
            <i data-lucide="refresh-cw" class="h-4 w-4 text-gray-500"></i>
            목록 새로고침
          </button>
        </div>
      </div>

      <div id="taskHistoryMessage" class="hidden"></div>

      <section class="section_card overflow-hidden rounded-2xl border border-gray-100 bg-white p-0 shadow-sm">
        <div class="overflow-x-auto">
          <table class="w-full whitespace-nowrap text-left text-sm">
            <thead class="border-b border-gray-100 bg-gray-50/50 text-gray-500">
              <tr>
                <th class="px-6 py-4 font-semibold">작업 ID / 유형</th>
                <th class="px-6 py-4 font-semibold">액션명</th>
                <th class="px-6 py-4 font-semibold">요청 일시</th>
                <th class="px-6 py-4 font-semibold">완료 일시</th>
                <th class="px-6 py-4 font-semibold">상태</th>
                <th class="px-6 py-4 text-right font-semibold">관리</th>
              </tr>
            </thead>
            <tbody id="taskTableBody" class="divide-y divide-gray-100">
              <tr>
                <td colspan="6" class="px-6 py-10 text-center text-gray-400">작업 이력을 불러오는 중입니다.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="flex items-center justify-between border-t border-gray-100 bg-gray-50/30 px-6 py-4">
          <span class="text-sm text-gray-500" id="pageInfo">페이지 1 / 1 · 총 0건</span>
          <div class="flex items-center gap-2">
            <button id="prevPageBtn" class="rounded-lg border border-gray-200 bg-gray-50 p-2 text-gray-600 transition-colors hover:bg-white disabled:cursor-not-allowed disabled:opacity-50">
              <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
            <button id="nextPageBtn" class="rounded-lg border border-gray-200 bg-gray-50 p-2 text-gray-600 transition-colors hover:bg-white disabled:cursor-not-allowed disabled:opacity-50">
              <i data-lucide="chevron-right" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="detailModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div id="modalBackdrop" class="fixed inset-0 bg-gray-900/50 opacity-0 backdrop-blur-sm transition-opacity"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div id="modalPanel" class="relative transform overflow-hidden rounded-2xl bg-white text-left opacity-0 shadow-xl transition-all translate-y-4 sm:my-8 sm:w-full sm:max-w-4xl sm:translate-y-0 sm:scale-95">
          <div class="bg-white px-6 pb-6 pt-6 sm:p-8">
            <div class="mb-6 flex items-center justify-between border-b border-gray-100 pb-4">
              <div class="flex items-center gap-3">
                <i data-lucide="file-code" class="h-6 w-6 text-indigo-600"></i>
                <h3 class="text-xl font-bold leading-6 text-gray-900" id="modal-title">작업 이력 상세</h3>
              </div>
              <button type="button" id="closeModalBtn" class="rounded-full bg-gray-50 p-2 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-500">
                <i data-lucide="x" class="h-5 w-5"></i>
              </button>
            </div>

            <div class="space-y-6">
              <div class="grid grid-cols-1 gap-4 rounded-xl border border-gray-100 bg-gray-50 p-4 text-sm md:grid-cols-2">
                <div><span class="inline-block w-24 font-medium text-gray-500">Task ID</span><span class="font-semibold text-gray-900" id="modalTaskId"></span></div>
                <div><span class="inline-block w-24 font-medium text-gray-500">Type</span><span class="font-semibold text-gray-900" id="modalTaskType"></span></div>
                <div><span class="inline-block w-24 font-medium text-gray-500">Action</span><span class="font-semibold text-gray-900" id="modalActionName"></span></div>
                <div><span class="inline-block w-24 font-medium text-gray-500">Status</span><span id="modalStatusBadge"></span></div>
              </div>

              <div>
                <h4 class="mb-2 flex items-center gap-2 text-sm font-bold text-gray-700">
                  <i data-lucide="arrow-right-circle" class="h-4 w-4 text-gray-400"></i>
                  Request Payload
                </h4>
                <div class="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900 p-4 shadow-inner">
                  <pre><code id="modalRequestPayload" class="text-xs font-mono text-gray-300"></code></pre>
                </div>
              </div>

              <div>
                <h4 class="mb-2 flex items-center gap-2 text-sm font-bold text-gray-700">
                  <i data-lucide="arrow-left-circle" class="h-4 w-4 text-gray-400"></i>
                  Response Payload
                </h4>
                <div class="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900 p-4 shadow-inner">
                  <pre><code id="modalResponsePayload" class="text-xs font-mono text-gray-300"></code></pre>
                </div>
              </div>

              <div id="modalErrorSection" class="hidden">
                <h4 class="mb-2 flex items-center gap-2 text-sm font-bold text-red-600">
                  <i data-lucide="alert-triangle" class="h-4 w-4 text-red-500"></i>
                  Error Message
                </h4>
                <div id="modalErrorMessage" class="overflow-x-auto whitespace-pre-wrap rounded-xl border border-red-100 bg-red-50 p-4 font-mono text-sm text-red-700"></div>
              </div>
            </div>
          </div>
          <div class="border-t border-gray-100 bg-gray-50 px-6 py-4 sm:flex sm:flex-row-reverse sm:px-8">
            <button type="button" id="closeModalBottomBtn" class="mt-3 inline-flex w-full justify-center rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition-colors hover:bg-gray-50 sm:mt-0 sm:w-auto">
              닫기
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../services/common/session.js"></script>
  <script src="../../services/common/app-shell.js"></script>
  <script src="../../services/common/sidebar.js"></script>
  <script src="../../services/admin/task-history.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.lucide) {
        window.lucide.createIcons();
      }
      window.ddukAppShell.hydratePage({
        title: "작업 이력 관리",
        description: "AI와 RPA 작업의 상태, 실행 시각, 상세 payload를 확인합니다."
      });
    });
  </script>
</body>

</html>

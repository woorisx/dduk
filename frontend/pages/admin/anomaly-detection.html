<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDUK ERP - 이상 탐지 경고 목록</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/common/dashboard.css">
  <style>
    body { font-family: "DM Sans", sans-serif; }
  </style>
</head>
<body class="w-full bg-slate-50">
  <aside data-dduk-sidebar></aside>

  <div class="main_wrap">
    <header class="topbar border-b border-slate-200 bg-white">
      <button class="sidebar_icon_btn dduk-inline-027" onclick="toggleSidebar()" id="mobile_menu_btn" aria-label="메뉴">
        <i class="dduk-inline-028" data-lucide="menu"></i>
      </button>
      <div class="flex-1 px-4">
        <h2 class="text-lg font-semibold text-slate-900">이상 탐지 경고 목록</h2>
      </div>
    </header>

    <main class="content_area space-y-6 p-6">
      <section class="rounded-3xl border border-rose-100 bg-gradient-to-r from-rose-50 via-amber-50 to-white p-6 shadow-sm">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p class="text-xs font-black uppercase tracking-[0.24em] text-rose-500">Phase 2 Anomaly MVP</p>
            <h1 class="mt-2 text-3xl font-black text-slate-900">규칙 기반 이상 탐지</h1>
            <p class="mt-2 text-sm font-medium text-slate-600">재고와 발주 추천 데이터를 기준으로 설명 가능한 경고만 모아 본다.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="refreshSummaryBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">요약 새로고침</button>
            <button id="runDetectionBtn" type="button" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-black text-white hover:bg-slate-700">탐지 다시 실행</button>
          </div>
        </div>
      </section>

      <div id="anomalyMessage" class="hidden rounded-2xl border px-4 py-3 text-sm font-semibold"></div>

      <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-5">
        <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-black uppercase tracking-[0.18em] text-slate-400">활성 경고</p>
          <p id="summaryActiveCount" class="mt-2 text-3xl font-black text-slate-900">-</p>
        </article>
        <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-black uppercase tracking-[0.18em] text-amber-500">OPEN</p>
          <p id="summaryOpenCount" class="mt-2 text-3xl font-black text-amber-600">-</p>
        </article>
        <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-black uppercase tracking-[0.18em] text-emerald-500">CONFIRMED</p>
          <p id="summaryConfirmedCount" class="mt-2 text-3xl font-black text-emerald-600">-</p>
        </article>
        <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-black uppercase tracking-[0.18em] text-rose-500">CRITICAL</p>
          <p id="summaryCriticalCount" class="mt-2 text-3xl font-black text-rose-600">-</p>
        </article>
        <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-black uppercase tracking-[0.18em] text-indigo-500">HIGH</p>
          <p id="summaryHighCount" class="mt-2 text-3xl font-black text-indigo-600">-</p>
        </article>
      </section>

      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <form id="anomalyFilterForm" class="grid gap-3 lg:grid-cols-5">
          <select id="filterStatus" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700">
            <option value="">전체 상태</option>
            <option value="OPEN">OPEN</option>
            <option value="CONFIRMED">CONFIRMED</option>
            <option value="FALSE_POSITIVE">FALSE_POSITIVE</option>
            <option value="IGNORED">IGNORED</option>
          </select>
          <select id="filterActive" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700">
            <option value="">전체 활성 여부</option>
            <option value="true">활성만</option>
            <option value="false">비활성만</option>
          </select>
          <select id="filterSeverity" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700">
            <option value="">전체 심각도</option>
            <option value="CRITICAL">CRITICAL</option>
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
          </select>
          <input id="filterKeyword" type="text" placeholder="품목명, 창고명, 제목 검색" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 placeholder:text-slate-400">
          <div class="flex gap-2">
            <button type="submit" class="flex-1 rounded-xl bg-slate-900 px-4 py-2 text-sm font-black text-white hover:bg-slate-700">조회</button>
            <button id="resetFiltersBtn" type="button" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50">초기화</button>
          </div>
        </form>
      </section>

      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[1100px] text-left text-sm">
            <thead class="bg-slate-50 text-xs font-black uppercase tracking-[0.16em] text-slate-500">
              <tr>
                <th class="px-5 py-4">심각도</th>
                <th class="px-5 py-4">규칙</th>
                <th class="px-5 py-4">대상</th>
                <th class="px-5 py-4">요약</th>
                <th class="px-5 py-4">상태</th>
                <th class="px-5 py-4">최근 감지</th>
                <th class="px-5 py-4 text-right">조치</th>
              </tr>
            </thead>
            <tbody id="anomalyTableBody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="7" class="px-5 py-10 text-center text-slate-400">이상 탐지 목록을 불러오는 중이야.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="flex items-center justify-between border-t border-slate-100 bg-slate-50/70 px-5 py-4">
          <p id="anomalyPageInfo" class="text-sm font-medium text-slate-500">페이지 1 / 1</p>
          <div class="flex gap-2">
            <button id="prevPageBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50">이전</button>
            <button id="nextPageBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50">다음</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../services/common/session.js"></script>
  <script src="../../services/common/app-shell.js"></script>
  <script src="../../services/common/sidebar.js"></script>
  <script src="../../services/admin/anomaly-detection.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.lucide) {
        window.lucide.createIcons();
      }
      window.ddukAppShell.hydratePage({
        title: "이상 탐지 경고 목록",
        description: "규칙 기반 경고를 검토하고 상태를 관리한다."
      });
    });
  </script>
</body>
</html>
